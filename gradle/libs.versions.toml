[versions]
agp = "9.4.1"
kotlin = "2.4.20"
composeBom = "2026.06.01"
activityCompose = "1.13.0"
coreKtx = "1.18.0"
lifecycle = "2.10.0"
navigation = "2.9.8"
exifinterface = "1.4.2"
coroutines = "1.11.0"
playServicesAds = "25.5.0"
ump = "4.0.0"
junit = "4.13.2"
robolectric = "4.17"
roborazzi = "1.75.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
